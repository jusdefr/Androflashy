# NexOS : construction de l'image ISO amorçable sur GitHub Actions.
# - à chaque push sur main : build + validation + artefact nexos-iso
# - à chaque tag v* : attache nexos.iso et nexos.img à la release GitHub
name: build-iso

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release à créer avec le .iso (ex: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer nasm et xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm xorriso

      - name: Construire l'image disquette
        run: make release

      - name: Valider l'image (tests hors QEMU)
        run: python3 tests/test_image.py build/nexos.img build/kernel.elf

      - name: Construire l'ISO amorçable (El Torito, émulation disquette)
        run: make iso

      - name: Vérifier l'ISO
        run: |
          test -f build/nexos.iso
          stat -c '%n %s octets' build/nexos.iso
          file build/nexos.iso || true

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: nexos-iso
          path: |
            build/nexos.iso
            build/nexos.img
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les artefacts du build
        uses: actions/download-artifact@v4
        with:
          name: nexos-iso
          path: dist

      - name: Créer la release du tag et attacher les images
        uses: softprops/action-gh-release@v2
        with:
          # sur push de tag : github.ref_name est le tag ; sur dispatch : l'input
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: NexOS ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            Images bootables construites automatiquement.
            - `nexos.iso` : CD-ROM amorçable (El Torito, emulation disquette 1,44 Mo)
            - `nexos.img` : disquette brute 1,44 Mo
            QEMU : `qemu-system-i386 -machine pc -m 32M -cdrom nexos.iso -boot d`
            ou : `qemu-system-i386 -machine pc -m 32M -drive file=nexos.img,format=raw,if=floppy -boot a`
          files: |
            dist/nexos.iso
            dist/nexos.img
